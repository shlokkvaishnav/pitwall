[project]
name = "pitwall"
version = "0.1.0"
description = "An F1 strategy tool that predicts whether an undercut will work. It learned from 1,190 real pit battles (2018 to 2026) and runs in the browser."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
model = ["lightgbm", "scikit-learn"]
ml = ["torch"]
dev = ["pytest", "ruff", "hypothesis", "mypy", "pandas-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.mypy]
ignore_missing_imports = true
