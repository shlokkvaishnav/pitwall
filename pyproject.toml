[project]
name = "pitwall"
version = "0.1.0"
description = "F1 pit-strategy model. It predicts if an undercut will work: the chance that a car that pits first comes out ahead of its rival. Also a lap-time model and a race simulator."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
model = ["lightgbm", "scikit-learn"]
ml = ["torch"]
dev = ["pytest", "ruff", "hypothesis", "mypy", "pandas-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.mypy]
ignore_missing_imports = true
