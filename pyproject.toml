[project]
name = "pitwall"
version = "0.1.0"
description = "F1 race-strategy models built from public lap data. It forecasts lap times, estimates whether an undercut will work, and simulates races, all tested on locked 2026 races."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
model = ["lightgbm", "scikit-learn"]
deep = ["torch==2.15.0"]
radio = ["faster-whisper==1.1.1", "av==13.1.0"]
rl = ["stable-baselines3==2.4.1", "gymnasium==1.0.0"]
dev = ["pytest", "ruff", "hypothesis", "mypy", "pandas-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.mypy]
ignore_missing_imports = true
