[project]
name = "pitwall"
version = "0.1.0"
description = "Finds the hidden battery state of 2026 F1 cars from public timing data, then tests a race simulator and a pit-strategy agent."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
model = ["lightgbm"]
ml = ["torch"]
dev = ["pytest", "ruff", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
